name: Build Janu AI Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Janu AI Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck & Build Frontend Bundle
        run: |
          npm run lint
          npm run build

      - name: Sync Web Bundle to Capacitor Android
        run: npx cap sync android

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --project-dir android --gradle-version 8.14.3
          fi
          chmod +x android/gradlew

      - name: Build Installable Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Signed Release APK (When Signing Secrets Are Configured)
        working-directory: android
        env:
          JANU_KEYSTORE_BASE64: ${{ secrets.JANU_KEYSTORE_BASE64 }}
          JANU_KEYSTORE_PASSWORD: ${{ secrets.JANU_KEYSTORE_PASSWORD }}
          JANU_KEY_ALIAS: ${{ secrets.JANU_KEY_ALIAS }}
          JANU_KEY_PASSWORD: ${{ secrets.JANU_KEY_PASSWORD }}
          PIYA_KEYSTORE_BASE64: ${{ secrets.PIYA_KEYSTORE_BASE64 }}
          PIYA_KEYSTORE_PASSWORD: ${{ secrets.PIYA_KEYSTORE_PASSWORD }}
          PIYA_KEY_ALIAS: ${{ secrets.PIYA_KEY_ALIAS }}
          PIYA_KEY_PASSWORD: ${{ secrets.PIYA_KEY_PASSWORD }}
        run: |
          KEYSTORE_B64="${JANU_KEYSTORE_BASE64:-$PIYA_KEYSTORE_BASE64}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > janu-release.jks
            export PIYA_KEYSTORE_PATH="$PWD/janu-release.jks"
            export PIYA_KEYSTORE_PASSWORD="${JANU_KEYSTORE_PASSWORD:-$PIYA_KEYSTORE_PASSWORD}"
            export PIYA_KEY_ALIAS="${JANU_KEY_ALIAS:-$PIYA_KEY_ALIAS}"
            export PIYA_KEY_PASSWORD="${JANU_KEY_PASSWORD:-$PIYA_KEY_PASSWORD}"
            ./gradlew assembleRelease --no-daemon --stacktrace
            rm -f janu-release.jks
          else
            echo "No release keystore secret configured; skipping optional signed release APK (Debug APK already built)."
          fi

      - name: Collect Generated APK Files
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Janu-AI-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk-output/Janu-AI-signed-release.apk
          fi

      - name: Upload Janu AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Janu-AI-Android-APK
          path: apk-output/*.apk
          retention-days: 90
